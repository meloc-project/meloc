doctype: meloc/module@0.0.0
name: tic-tac-toe

selects:
  - name: symbol
    options:
      x: text "✗"
      o: text "○"

data:
  - name: board
    type: list(symbol?)
    initial-value: list(-count 9)

actions:
  - name: mark
    modifies-data: yes
    inputs:
      - name: index
        type: number
        is-natural: yes
        min-value: 1
        max-value: 9
    preconditions:
      - formula: not is-game-over
        error-message: Game is over
      - formula: board.get(index).is(none)
        error-message: Cell is already occupied
    formula: board.get(index).set(current-player)

derived:
  - name: is-game-over
    type: assertion
    formula: winner.notEquals(none) or board.all(cell => cell.notEquals(none))
  - name: winner
    type: symbol?
    formula: |
      lines.find-map(line => {
        if
          board.get(line.get(1)).equals(board.get(line.get(2))) and
          board.get(line.get(2)).equals(board.get(line.get(3)))
        then board.get(a)
        else none
      })
  - name: current-player
    type: symbol
    formula: symbol.x if turn.is-odd else symbol.o
  - name: turn
    type: number
    formula: board.filter(cell => cell.notEquals(none)).count.add(1)

static:
  - name: lines
    type: list(list(number))
    value: |
      list(
        list(1, 2, 3), list(4, 5, 6), list(7, 8, 9), # horizontal
        list(1, 4, 7), list(2, 5, 8), list(3, 6, 9), # vertical
        list(1, 5, 9), list(3, 5, 7), # diagonal
      )
