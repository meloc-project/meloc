doctype: meloc/module@0.0.0
name: tic-tac-toe

data:
  - name: board
    type: list(symbol?)
    count: 9

selects:
  - name: symbol
    option-type: text
    options:
      x: expr "✗"
      o: expr "○"

actions:
  - name: mark
    inputs:
      - name: index
        type: number
        is-natural: yes
        min-value: 1
        max-value: 9
    preconditions:
      - check: not is-game-over
        error-message: expr "Game is over"
      - check: board.get(index).equals(none)
        error-message: expr "Cell is already occupied"
    modifies-data: yes
    do: board.get(index).set(current-player)

derived:
  - name: current-player
    type: symbol
    formula: if turn.is-odd then symbol.x else symbol.y
  - name: turn
    type: number
    formula: board.filled.count.add(1)
  - name: is-game-over
    type: assertion
    formula: not winner.equals(none) or board.filled.count.equals(9)
  - name: winner
    type: symbol
    formula: |
      lines.find-and-transform(
        if it.get(1).equals(it.get(2)) and it.get(2).equals(it.get(3))
        then it.get(1)
        else none
      )
  - name: lines
    type: list(list(symbol))
    formula: |
      list(
        # horizontal
        board.get-many(1, 2, 3),
        board.get-many(4, 5, 6),
        board.get-many(7, 8, 9),
        # vertical
        board.get-many(1, 4, 7),
        board.get-many(2, 5, 8),
        board.get-many(3, 6, 9), 
        # diagonal
        board.get-many(1, 5, 9),
        board.get-many(3, 5, 7)
      )
